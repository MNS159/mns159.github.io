<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Daily Dose of News</title>
<meta name="description" content="Search every story ever published, filtered by section and year.">
<link rel="canonical" href="https://mns159.github.io/search/">
<meta property="og:site_name" content="Daily Dose of News">
<meta property="og:title" content="Search — Daily Dose of News">
<meta property="og:description" content="Search every story ever published, filtered by section and year.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mns159.github.io/search/">
<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="Daily Dose of News" href="https://mns159.github.io/feed.xml">
<meta name="theme-color" content="#F3F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1720" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/static/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/site.css">
  <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/pagefind/pagefind-ui.js"></script>
  <style>
    /* Blend Pagefind's default UI into the chill-blue system. */
    #search{--pagefind-ui-primary:var(--accent);--pagefind-ui-text:var(--text);
      --pagefind-ui-background:var(--surface);--pagefind-ui-border:var(--hairline);
      --pagefind-ui-tag:var(--tint);--pagefind-ui-border-width:1px;
      --pagefind-ui-border-radius:8px;--pagefind-ui-font:var(--sans);margin-top:22px;}
    #search .pagefind-ui__result-title{font-family:var(--serif);}
  </style>
</head>
<body>

  <nav class="topnav">
    <a href="/">Front Page</a>
    <a href="/section/politics/">Politics</a>
    <a href="/section/world/">International &amp; World</a>
    <a href="/section/markets/">Financial &amp; Markets</a>
    <a href="/section/sports/">Sports</a>
    <a href="/section/health-science/">Health &amp; Science</a>
    <a href="/section/tech-ai/">Tech / AI</a>
    <a href="/archive/">Archive</a>
    <a href="/search/" class="active">Search</a>
  </nav>

  <header class="masthead">
    <a class="wordmark" href="/">Daily Dose of News</a>
  <h1 class="section-title">Search</h1>
  <div class="dateline">Every story ever published — filter by section or year</div>
  <hr class="accent-rule">
  </header>

  <main>
    <div id="search"></div>
    <noscript><p class="archive-empty">Search needs JavaScript. You can also browse
      the <a href="/archive/">archive</a>.</p></noscript>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        if (typeof PagefindUI !== 'undefined') {
          new PagefindUI({
            element: '#search',
            showSubResults: false,
            showImages: false,
            sort: { date: 'desc' },
            translations: { placeholder: 'Search stories…' }
          });
        } else {
          document.getElementById('search').innerHTML =
            '<p class="archive-empty">The search index has not been built yet — it is generated by the daily publish. Browse the <a href="/archive/">archive</a> instead.</p>';
        }
      });
    </script>
  </main>

  <footer class="site-foot">
    <a href="/">Front Page</a>
    <a href="/archive/">Archive</a>
    <span>Sunday, July 26, 2026 · Morning edition</span>
  </footer>

</body>
</html>
